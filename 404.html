<!DOCTYPE html>
<html lang="en">
<head>
<!-- Apply saved settings -->
<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('pp_settings') || '{}');
    var root = document.documentElement;
    if(s.accent){ root.style.setProperty('--sage', s.accent); }
    if(s.accentPale){ root.style.setProperty('--sage-pale', s.accentPale); }
    if(s.accentLight){ root.style.setProperty('--sage-light', s.accentLight); }
    if(s.dark){ document.documentElement.setAttribute('data-theme','dark'); }
  } catch(e) {}
})();
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PetalPages — Page Not Found</title>\n <link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --sage:#6B8F6B;--sage-light:#A8C5A0;--sage-pale:#D4E8CC;
  --pink:#C4717A;--pink-pale:#F5D8DC;--pink-light:#E8A0A8;
  --cream:#FAF6EE;--cream-dark:#F0EAD8;
  --gold:#B8962E;--gold-light:#D4B060;
  --text:#2C2418;--text-mid:#6B5840;--text-light:#A89880;
}
html{scroll-behavior:smooth;}
body{
  min-height:100vh;
  background:var(--cream);
  font-family:'Instrument Sans',sans-serif;
  font-weight:300;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

/* ── BACKGROUND SPIRAL DOTS ── */
.bg-canvas{position:fixed;inset:0;z-index:0;opacity:0.1;pointer-events:none;}

/* ── FLOATING PETALS ── */
.float-el{position:fixed;pointer-events:none;z-index:1;animation:gentleFloat ease-in-out infinite;}
@keyframes gentleFloat{
  0%,100%{transform:translateY(0) rotate(0deg);}
  33%{transform:translateY(-14px) rotate(4deg);}
  66%{transform:translateY(-7px) rotate(-3deg);}
}

/* ── MAIN CONTENT ── */
.content{
  position:relative;z-index:2;
  text-align:center;
  max-width:520px;
  padding:2rem;
  animation:fadeUp 0.7s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

/* big 404 */
.num-wrap{position:relative;display:inline-block;margin-bottom:0.5rem;}
.num{
  font-family:'DM Serif Display',serif;
  font-size:clamp(6rem,18vw,11rem);
  font-style:italic;
  line-height:1;
  background:linear-gradient(135deg,var(--sage) 0%,var(--pink) 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:block;
  animation:shimmer 4s ease-in-out infinite;
}
@keyframes shimmer{
  0%,100%{filter:brightness(1);}
  50%{filter:brightness(1.15);}
}

/* flower inside 0 */
.flower-in-zero{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-55%);
  pointer-events:none;
}

.tag{
  display:inline-flex;align-items:center;gap:0.5rem;
  background:var(--pink-pale);border:1px solid rgba(196,113,122,0.2);
  border-radius:6px;padding:0.3rem 0.9rem;
  font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--pink);margin-bottom:1.5rem;
}

.title{
  font-family:'DM Serif Display',serif;
  font-size:clamp(1.6rem,4vw,2.5rem);
  font-style:italic;color:var(--text);
  margin-bottom:0.6rem;line-height:1.15;
}
.title em{color:var(--sage);}

.subtitle{
  font-family:'Lora',serif;font-style:italic;
  font-size:1rem;color:var(--text-mid);
  line-height:1.75;margin-bottom:2.2rem;
  max-width:400px;margin-left:auto;margin-right:auto;
}

/* buttons */
.btn-row{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;}
.btn-primary{
  display:inline-flex;align-items:center;gap:0.55rem;
  background:var(--text);color:white;
  padding:0.9rem 2rem;border-radius:10px;
  font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;
  text-decoration:none;font-weight:400;transition:all 0.25s;
  border:none;cursor:pointer;font-family:'Instrument Sans',sans-serif;
}
.btn-primary:hover{background:var(--sage);transform:translateY(-2px);box-shadow:0 8px 24px rgba(107,143,107,0.25);}
.btn-primary svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;}
.btn-ghost{
  display:inline-flex;align-items:center;gap:0.55rem;
  border:1.5px solid rgba(168,197,160,0.4);color:var(--text-mid);
  padding:0.9rem 2rem;border-radius:10px;
  font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;
  text-decoration:none;font-weight:400;transition:all 0.25s;
}
.btn-ghost:hover{background:var(--sage-pale);border-color:var(--sage-light);color:var(--sage);transform:translateY(-2px);}
.btn-ghost svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;}

/* quick links */
.quick-links{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;}
.quick-link{
  font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-light);text-decoration:none;
  display:flex;align-items:center;gap:0.35rem;
  transition:color 0.2s;border-bottom:1px solid transparent;
  padding-bottom:1px;
}
.quick-link:hover{color:var(--sage);border-color:var(--sage-light);}

/* logo top */
.top-logo{
  position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);
  z-index:10;
  font-family:'DM Serif Display',serif;font-size:1.35rem;font-style:italic;
  color:var(--sage);text-decoration:none;
}
.top-logo span{color:var(--pink);}

/* divider ornament */
.ornament{
  font-size:0.7rem;color:var(--text-light);
  letter-spacing:0.6rem;margin:0 auto 1.5rem;
  opacity:0.5;display:block;
}

@media(max-width:600px){
  .num { font-size: 5rem !important; }
  .title { font-size: 1.4rem !important; }
  .subtitle { font-size: 0.88rem !important; }
  .btn-row { flex-direction: column; align-items: center; }
  .btn-primary, .btn-ghost { width: 100%; justify-content: center; }
  .quick-links { gap: 1rem; }
  .content { padding: 1.5rem 1rem; }
  .float-el { display: none; }
}
@media(max-width:400px){
  .num { font-size: 4rem !important; }
  .flower-in-zero { display: none; }
}

</style>
</head>

<script>
// ── CANVAS SPIRAL BG ──
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', function(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawBg();
});

function drawBg(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width/2, cy = canvas.height/2;
  const colors = ['rgba(168,197,160,0.4)','rgba(196,113,122,0.3)','rgba(212,176,96,0.3)','rgba(255,255,255,0.5)'];
  for(let ring=1; ring<=10; ring++){
    const r = ring*65, dots = Math.floor(ring*9);
    for(let d=0; d<dots; d++){
      const angle = (d/dots)*Math.PI*2;
      ctx.beginPath();
      ctx.arc(
        cx + Math.cos(angle)*r + (Math.random()*8-4),
        cy + Math.sin(angle)*r + (Math.random()*8-4),
        Math.random()*2.2+0.5, 0, Math.PI*2
      );
      ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
      ctx.fill();
    }
  }
  // scattered mini flowers
  [[0.1,0.15],[0.9,0.12],[0.05,0.8],[0.92,0.75],[0.5,0.05],[0.15,0.5],[0.85,0.5],[0.5,0.95]].forEach(function(pos){
    const x = canvas.width*pos[0], y = canvas.height*pos[1];
    const fc = colors[Math.floor(Math.random()*colors.length)];
    for(let p=0; p<5; p++){
      const pa = (p/5)*Math.PI*2;
      ctx.beginPath();
      ctx.ellipse(x+Math.cos(pa)*9, y+Math.sin(pa)*9, 3, 7, pa, 0, Math.PI*2);
      ctx.fillStyle = fc; ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(250,246,238,0.85)'; ctx.fill();
  });
}
drawBg();

// ── AUTO REDIRECT after 30 seconds ──
let countdown = 30;
const interval = setInterval(function(){
  countdown--;
  if(countdown <= 0){
    clearInterval(interval);
    window.location.href = 'index.html';
  }
}, 1000);
</script>
